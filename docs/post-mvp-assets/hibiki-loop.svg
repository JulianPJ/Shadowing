<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><rect width="1600" height="600" fill="#f8f7f2"/><style>.t{font:44px Georgia,serif;fill:#303a33}.s{font:22px Arial,sans-serif;fill:#81867d}.h{font:28px Georgia,serif;fill:#303a33}.b{font:17px Arial,sans-serif;fill:#81867d}.n{font:18px Arial,sans-serif;fill:white}</style><text x="70" y="85" class="t">Recommended Hibiki post-MVP loop</text><text x="70" y="125" class="s">Practice creates memory; memory changes the next practice session.</text>
