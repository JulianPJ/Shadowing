name: Playwright

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Both production runtimes run the full media/browser and native D1 checks.
    timeout-minutes: 35
    env:
      CI: true
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run unit and integration tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          mkdir -p artifacts
          npm start > artifacts/next-server.log 2>&1 &
          echo $! > artifacts/next-server.pid

      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Application did not become ready in time."
          cat artifacts/next-server.log || true
          exit 1

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Apply local D1 migrations
        timeout-minutes: 2
        run: npm run test:d1:migrations

      - name: Build canonical Worker
        run: npm run build:vinext

      - name: Verify built Worker and D1
        run: npm run test:d1:runtime

      - name: Start isolated built Worker
        run: |
          npm run start:vinext:test > artifacts/worker-server.log 2>&1 &
          echo $! > artifacts/worker-server.pid

      - name: Wait for built Worker
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://localhost:3001/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/worker-server.log || true
          exit 1

      - name: Run Playwright against built Worker
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            artifacts/
          if-no-files-found: ignore
          retention-days: 7
