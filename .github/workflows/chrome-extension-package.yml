name: Chrome extension package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extension/**'
      - 'scripts/package-extension.py'
      - '.github/workflows/chrome-extension-package.yml'
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'scripts/package-extension.py'
      - '.github/workflows/chrome-extension-package.yml'

permissions:
  contents: read

jobs:
  package:
    name: Verify Chrome Web Store upload ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24 for formatting patch
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install formatter
        run: npm ci
      - name: Print exact Prettier patch
        run: |
          npx prettier --write extension/youtube.js tests/extension-youtube.test.mjs tests/e2e/extension.spec.ts
          git diff -- extension/youtube.js tests/extension-youtube.test.mjs tests/e2e/extension.spec.ts
      - name: Test canonical YouTube video detection
        run: node --test tests/extension-youtube.test.mjs
      - name: Create store package from allowlisted files
        run: python3 scripts/package-extension.py
      - name: Inspect ZIP
        run: |
          unzip -l dist/hibiki-bridge-*.zip
          python3 -m json.tool extension/manifest.json > /dev/null
      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: hibiki-bridge-chrome-web-store
          path: dist/hibiki-bridge-*.zip
          if-no-files-found: error
          retention-days: 30
