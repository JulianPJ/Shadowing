name: Temporary backfill formatting
on:
  push:
    branches:
      - feature/discover-ai-catalogue-backfill-20261010
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/discover-ai-catalogue-backfill-20261010
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/discover/enrich.ts tests/discover-d1.test.ts cloudflare-worker.js cloudflare.config.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/discover/enrich.ts tests/discover-d1.test.ts cloudflare-worker.js cloudflare.config.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Format Discover enrichment files'
            git push origin HEAD:feature/discover-ai-catalogue-backfill-20261010
          fi
