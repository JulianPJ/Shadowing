name: Temporary Discover integration diagnostics
on:
  push:
    branches:
      - feature/discover-ai-catalogue-backfill-20261010
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/discover-ai-catalogue-backfill-20261010
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture isolated D1 test failure
        shell: bash
        run: |
          set +e
          npx tsx --test tests/discover-d1.test.ts > /tmp/discover-test-log.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" > discover-test-diagnostics.txt
          tail -n 220 /tmp/discover-test-log.txt >> discover-test-diagnostics.txt
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add discover-test-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Temporary integration diagnostic output'
            git push origin HEAD:feature/discover-ai-catalogue-backfill-20261010
          fi
